[workspace]
members = [
    "crates/clipstash-types",
    "crates/clipstash-store",
    "crates/clipstash-pb",
    "crates/clipstash-hotkey",
    "crates/clipstash-ui",
    "crates/clipstash-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
clipstash-types = { path = "crates/clipstash-types" }
clipstash-store = { path = "crates/clipstash-store" }
clipstash-pb = { path = "crates/clipstash-pb" }
clipstash-hotkey = { path = "crates/clipstash-hotkey" }
clipstash-ui = { path = "crates/clipstash-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rmp-serde = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSURL", "NSNotification", "NSRunLoop", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSStatusBar", "NSStatusItem", "NSMenu", "NSMenuItem", "NSImage", "NSWindow", "NSPanel", "NSView", "NSTextField", "NSEvent", "NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSVisualEffectView", "NSAlert", "NSScreen", "NSColor", "NSFont", "NSScrollView", "NSStackView", "NSButton", "NSImageView", "NSStatusBarButton", "NSWindowScripting"] }
core-graphics = "0.24"
core-graphics-types = "0.2"
core-foundation = "0.10"
bitflags = "2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
